[package]
name = "rapidraw-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server bridging AI clients to RapidRAW External Control API"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "rapidraw", "photo", "raw"]
categories = ["command-line-utilities"]

[[bin]]
name = "rapidraw-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3", features = ["server", "transport-io", "base64", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
